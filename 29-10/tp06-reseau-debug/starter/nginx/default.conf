server {
    listen 80;
    location /health { return 200 'front ok'; }
    location / {
        # [A13] localhost dans le conteneur nginx = nginx lui-meme, pas l'api
        # -> nom du service compose, resolu par le DNS docker (les 2 replicas)
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
