global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules.yml
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # metriques par conteneur (cpu, memoire, reseau, io)
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # id de cgroup -> nom du conteneur / service compose (voir compose.observability.yml)
  - job_name: docker-meta
    static_configs:
      - targets: ["docker-meta:9101"]

  # API : decouverte DNS. Le DNS docker renvoie une IP par replica pour "api",
  # donc si on passe a 3 replicas ils sont scrapes tout seuls (re-resolution toutes les 30s)
  - job_name: api
    dns_sd_configs:
      - names: ["api"]
        type: A
        port: 3000
        refresh_interval: 30s
    relabel_configs:
      - target_label: service
        replacement: api

  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100
        refresh_interval: 30s
    relabel_configs:
      - target_label: service
        replacement: worker
