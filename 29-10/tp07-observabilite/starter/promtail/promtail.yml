server:
  http_listen_port: 9080
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # tous les conteneurs de la machine, decouverts via la socket docker
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      # nom du conteneur sans le "/" du debut
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      # labels compose -> labels loki
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: project
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
    pipeline_stages:
      # api (pino) : {"level":30,...}  worker (python) : {"level":"INFO",...}
      # si la ligne est pas du JSON (nginx, postgres...) le stage json fait rien
      - json:
          expressions:
            level: level
      # level en label : cardinalite faible (6 valeurs max), ok pour un label
      - labels:
          level:
