# Stack Shop SAS - fichier de BASE commun a tous les environnements (TP04)
#
#   dev  : docker compose up -d --wait                  (compose.override.yml est charge tout seul)
#   prod : docker compose -f compose.yml -f compose.prod.yml up -d --wait
#   outils : docker compose --profile tools up -d       (adminer sur http://adminer.localhost)
#   migration : MIGRATION=002-add-sku.sql docker compose run --rm migrate
#
# Prerequis : secrets/db_password.txt (voir .env.example / make secrets)
name: shop

# ---------- blocs reutilisables (ancres YAML) ----------
# les cles x-* sont ignorees par compose, ca sert juste a poser des ancres
x-healthcheck-defaults: &hc-defaults
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 10s

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# commun a l'API et au worker : ils lisent seulement DATABASE_URL, donc on la construit
# au demarrage a partir du secret (le code est pas modifie). Le mot de passe est genere en hexa
# donc pas de caractere a url-encoder.
x-app: &app
  restart: unless-stopped
  logging: *logging
  secrets:
    - db_password
  environment: &app-env
    DB_USER: shop
    DB_HOST: db
    DB_NAME: shop
    REDIS_URL: redis://redis:6379
    LOG_LEVEL: info
  entrypoint:
    - /bin/sh
    - -c
    # $$ = un $ litteral pour compose, c'est le shell du conteneur qui interprete
    # TP09 "drain" : au SIGTERM on relaie a l'appli, et une fois qu'elle est arretee le conteneur reste
    # en vie DRAIN_SECONDS : le port est ferme mais l'IP existe encore -> le noyau repond RST tout de suite,
    # traefik bascule (retry) et son healthcheck actif sort le replica AVANT que l'IP disparaisse.
    # Sans ca : IP supprimee -> connexions dans le vide -> 504/timeouts cote client (mesures dans le RAPPORT).
    - |
      export DATABASE_URL="postgres://$${DB_USER}:$$(cat /run/secrets/db_password)@$${DB_HOST}:5432/$${DB_NAME}"
      "$$@" &
      pid=$$!
      trap 'kill -TERM $$pid; wait $$pid; rc=$$?; sleep "$${DRAIN_SECONDS:-3}"; exit $$rc' TERM INT
      wait $$pid
    - app

services:
  # ---------- reverse proxy : le SEUL service expose ----------
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    logging: *logging
    command:
      - --providers.docker=true
      # rien n'est expose sans traefik.enable=true explicite
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=shop_front
      - --entrypoints.web.address=:80
      - --ping=true
      - --accesslog=true
      # TP09 zero interruption : un backend qui vient de disparaitre (IP supprimee) fait attendre la connexion
      # jusqu'au dialTimeout (30s par defaut !). 250ms puis le middleware retry passe a l'autre replica
      # (1s au 1er essai : encore 30 timeouts cote client, 2 tentatives de suite sur le mort = 2s, cf RAPPORT)
      - --serverstransport.forwardingtimeouts.dialtimeout=250ms
      # Traefik applique les changements de conteneurs au plus toutes les 2s (defaut) : pendant ce temps il route
      # encore vers l'IP du replica supprime. 500ms = fenetre 4x plus courte (cf RAPPORT, mesures)
      - --providers.providersthrottleduration=500ms
      # pas de keep-alive traefik -> api : sinon traefik peut envoyer une requete sur une connexion que node est
      # en train de fermer (server.close au SIGTERM) -> 502 non rejouable. Cout : 1 connexion TCP locale par requete
      - --serverstransport.maxidleconnsperhost=-1
    ports:
      - "80:80"
    volumes:
      # lecture seule, mais attention : acces a la socket = root sur l'hote (voir RAPPORT)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - front
    healthcheck:
      <<: *hc-defaults
      test: ["CMD", "traefik", "healthcheck", "--ping"]

  api:
    <<: *app
    build:
      context: ./apps/shopapi
      args:
        APP_VERSION: dev
    image: shop/shopapi:dev
    command: ["node", "src/server.js"]
    # TP09 : SIGTERM -> l'api finit ses requetes en cours (server.close) avant le SIGKILL.
    # 15s > le timer de 10s du code (process.exit(1) si l'arret traine)
    stop_grace_period: 15s
    networks:
      - front
      - back
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      <<: *hc-defaults
      # /ready verifie aussi la base et redis, /health c'est juste "le process repond"
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`api.localhost`)
      - traefik.http.routers.api.entrypoints=web
      - traefik.http.services.api.loadbalancer.server.port=3000
      # healthcheck cote traefik : un replica qui repond plus est sorti du load balancer
      - traefik.http.services.api.loadbalancer.healthcheck.path=/health
      # TP09 : 1s (au lieu de 5s) pour sortir un replica en cours d'arret pendant son drain de 3s
      - traefik.http.services.api.loadbalancer.healthcheck.interval=1s
      - traefik.http.services.api.loadbalancer.healthcheck.timeout=500ms
      # TP09 : retry = si le replica choisi refuse la connexion (SIGTERM en cours) ou a disparu,
      # traefik rejoue la requete sur un autre replica au lieu de renvoyer 502 / timeout au client
      - traefik.http.middlewares.api-retry.retry.attempts=3
      - traefik.http.middlewares.api-retry.retry.initialinterval=100ms
      - traefik.http.routers.api.middlewares=api-retry@docker

  worker:
    <<: *app
    build:
      context: ./apps/shop-worker
      secrets:
        - pipconf
    image: shop/shop-worker:dev
    command: ["python", "-m", "worker.main"]
    # le merge YAML (<<) est pas recursif : si on redefinit environment il faut re-merger l'ancre
    environment:
      <<: *app-env
      # python logging veut INFO en majuscules (pino veut "info") -> le worker plantait en prod
      LOG_LEVEL: INFO
    networks:
      - back
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      <<: *hc-defaults
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/metrics', timeout=2)"]

  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: shop
      POSTGRES_DB: shop
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      # joue UNIQUEMENT au premier demarrage (volume vide)
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    networks:
      - back
    healthcheck:
      <<: *hc-defaults
      # -h 127.0.0.1 : pendant l'init, postgres ecoute que sur la socket unix,
      # donc ca evite d'etre "healthy" avant la fin du init.sql
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U shop -d shop"]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    logging: *logging
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks:
      - back
    healthcheck:
      <<: *hc-defaults
      test: ["CMD", "redis-cli", "ping"]

  # ---------- a la demande ----------
  adminer:
    image: adminer:4.8.1
    profiles: ["tools"]
    restart: unless-stopped
    logging: *logging
    environment:
      ADMINER_DEFAULT_SERVER: db
    # front pour etre joint par traefik, back pour joindre la base (cf bonus B3)
    networks:
      - front
      - back
    depends_on:
      db:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.adminer.rule=Host(`adminer.localhost`)
      - traefik.http.routers.adminer.entrypoints=web
      - traefik.http.services.adminer.loadbalancer.server.port=8080

  migrate:
    image: postgres:16.4-alpine
    profiles: ["ops"]
    restart: "no"
    secrets:
      - db_password
    environment:
      MIGRATION: ${MIGRATION:-}
    volumes:
      - ./db/migrations:/migrations:ro
    networks:
      - back
    depends_on:
      db:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        [ -n "$${MIGRATION}" ] || { echo "MIGRATION non defini (ex: MIGRATION=002-add-sku.sql)"; exit 1; }
        export PGPASSWORD="$$(cat /run/secrets/db_password)"
        echo ">> migration $${MIGRATION}"
        psql -h db -U shop -d shop -v ON_ERROR_STOP=1 -f "/migrations/$${MIGRATION}"

networks:
  front:
  back:
    # pas de passerelle vers l'exterieur : ni internet, ni publication de port
    internal: true

volumes:
  pgdata:
  redisdata:

secrets:
  db_password:
    file: ./secrets/db_password.txt
  # secret de BUILD du worker (pip.conf avec le token du registre pypi interne, cf TP02)
  pipconf:
    file: ./apps/shop-worker/pip.conf
