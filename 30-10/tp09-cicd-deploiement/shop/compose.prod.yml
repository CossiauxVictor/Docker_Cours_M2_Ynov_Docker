# Surcharge PROD
#   docker compose -f compose.yml -f compose.prod.yml config
#   docker compose -f compose.yml -f compose.prod.yml up -d --wait
# REGISTRY / VERSION viennent du .env (voir .env.example)

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

services:
  traefik:
    <<: *hardening
    # traefik a besoin de rien d'autre que d'ecouter sur :80 -> NET_BIND_SERVICE suffit
    cap_add: [NET_BIND_SERVICE]
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 128M }

  api:
    <<: *hardening
    # pas de build en prod : on tire l'image validee par la porte de release du TP03
    build: !reset null
    image: ${REGISTRY:?REGISTRY doit etre defini}/shopapi:${VERSION:?VERSION doit etre definie}
    pull_policy: missing
    environment:
      NODE_ENV: production
      APP_VERSION: ${VERSION}
    tmpfs:
      - /tmp:size=16m
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "0.50", memory: 256M }
        reservations: { memory: 64M }

  worker:
    <<: *hardening
    build: !reset null
    image: ${REGISTRY:?REGISTRY doit etre defini}/shop-worker:${VERSION:?VERSION doit etre definie}
    pull_policy: missing
    tmpfs:
      - /tmp:size=16m
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }

  db:
    # postgres demarre en root puis passe en user postgres (chown du volume) :
    # on garde donc les capabilities dont il a besoin, pas de read_only ici
    security_opt:
      - no-new-privileges:true
    shm_size: 128m
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  redis:
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }
