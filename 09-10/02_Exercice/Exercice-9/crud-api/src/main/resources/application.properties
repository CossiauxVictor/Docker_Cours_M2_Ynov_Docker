spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dogsdb}
spring.datasource.username=${DB_USER:dogsuser}
spring.datasource.password=${DB_PASSWORD:dogspass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

logs.api.url=${LOGS_API_URL:http://logs-api:8080/api/v1/logs}

server.port=8080
